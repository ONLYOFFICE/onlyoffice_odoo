name: test

on:
  workflow_dispatch:
  push:
    branches: [develop, 19.0, feature/19.0, 18.0, feature/18.0, 17.0]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'

jobs:
  # Unit tests of one addon; onlyoffice_odoo also has live Document Server tests (tests/test_document_server.py).
  unit:
    name: ${{ matrix.addon }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: onlyoffice_odoo
            coveragerc: .coveragerc
          # `hr` provides hr.employee and its bundled demo templates; it is installed before the tests so that its
          # own test suite does not run.
          - addon: onlyoffice_odoo_templates
            coveragerc: .coveragerc-templates
            preinstall: hr
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
      documentserver:
        image: onlyoffice/documentserver-de:latest
        env:
          JWT_ENABLED: "false"
    env:
      INCLUDE: ${{ matrix.addon }}
      COVERAGE_RCFILE: ${{ matrix.coveragerc }}
      # Combined with the data of the other jobs by the coverage job.
      COVERAGE_FILE: .coverage.${{ matrix.addon }}
      ONLYOFFICE_TEST_LIVE_DOCSERVER: "1"
      ONLYOFFICE_TEST_DOCSERVER_URL: "http://documentserver/"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create stubs for unavailable addons
        run: |
          mkdir -p documents documents_spreadsheet
          printf "{'name': 'Documents', 'version': '18.0.1.0.0', 'depends': ['base']}\n" > documents/__manifest__.py
          printf "{'name': 'Documents Spreadsheet', 'version': '18.0.1.0.0', 'depends': ['documents']}\n" > documents_spreadsheet/__manifest__.py
          touch documents/__init__.py documents_spreadsheet/__init__.py
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Initialize test db
        run: oca_init_test_database
      - name: Install modules needed by the tests
        if: matrix.preinstall
        run: odoo -d "$PGDATABASE" -i "${{ matrix.preinstall }}" --stop-after-init
      # The Document Server boots while the addons install. Its start ends with a restart of docservice (502 meanwhile),
      # after which the gzipped static files are made: AllFonts.js.gz marks the end, see e2e/scripts/wait-for-stack.mjs.
      - name: Wait for the Document Server
        run: >-
          timeout 600 sh -c 'until curl -fsS -o /dev/null http://documentserver/sdkjs/common/AllFonts.js.gz
          && curl -fsS http://documentserver/healthcheck; do sleep 5; done'
      # oca_run_tests, plus the live Document Server tests: they are tagged external_docserver instead of standard,
      # and oca_run_tests cannot select extra tags. All three modules are measured: the tests of one module also run
      # code of another (e.g. the Documents branches of onlyoffice_odoo), the coverage job adds them up.
      - name: Run tests
        run: >-
          coverage run --source onlyoffice_odoo,onlyoffice_odoo_templates,onlyoffice_odoo_documents --branch
          "$(which odoo)" -d "$PGDATABASE" -i "$INCLUDE" --test-enable --test-tags standard,external_docserver
          --stop-after-init
      - name: Check the coverage threshold of the module
        run: coverage report --include "$INCLUDE/*"
      # For the coverage job, which runs only with the documents job (see .github/actions/upload-coverage).
      - name: Upload the coverage data
        if: ${{ !startsWith(github.server_url, 'https://github.com') }}
        uses: ./.github/actions/upload-coverage
        with:
          addon: ${{ matrix.addon }}

  # The unit job of onlyoffice_odoo_documents: an action of ONLYOFFICE/onlyoffice_odoo_test, on Gitea only.
  documents:
    name: onlyoffice_odoo_documents
    if: ${{ !startsWith(github.server_url, 'https://github.com') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
      documentserver:
        image: onlyoffice/documentserver-de:latest
        env:
          JWT_ENABLED: "false"
    steps:
      - name: Install Node.js for the actions
        run: >-
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.gz
          | tar -xz -C /usr/local --strip-components=1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ONLYOFFICE/onlyoffice_odoo_test
          ref: "18.0"
          persist-credentials: false
          path: .test
          sparse-checkout: .github
      - uses: ./.test/.github/actions/unit
      - name: Upload the coverage data
        uses: ./.github/actions/upload-coverage
        with:
          addon: onlyoffice_odoo_documents

  # The coverage of each module by the tests of all three modules, with the thresholds of .coveragerc*. Skipped with the
  # documents job; then the unit jobs check only the threshold of their module.
  coverage:
    needs: [unit, documents]
    runs-on: ubuntu-22.04
    # The image of the unit jobs: the measured files are at the same paths.
    container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
    steps:
      - name: Install Node.js for the actions
        run: >-
          curl -fsSL https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.gz
          | tar -xz -C /usr/local --strip-components=1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v3
        with:
          path: coverage-data
      - name: Combine the coverage data
        run: coverage combine coverage-data/*/.coverage.*
      - name: Check the thresholds
        run: |
          status=0
          for rc in .coveragerc:onlyoffice_odoo .coveragerc-templates:onlyoffice_odoo_templates \
            .coveragerc-documents:onlyoffice_odoo_documents; do
            echo "::group::${rc#*:}"
            coverage report --rcfile "${rc%%:*}" --include "${rc#*:}/*" || status=1
            echo "::endgroup::"
          done
          coverage html --rcfile .coveragerc --include "onlyoffice_odoo*/*"
          exit $status
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: htmlcov
          retention-days: 14
