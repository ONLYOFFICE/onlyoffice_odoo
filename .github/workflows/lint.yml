name: Lint

on:
  workflow_dispatch:
  push:
    branches: [develop, 19.0, feature/19.0, 18.0, feature/18.0, 17.0]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm i
      - uses: pre-commit/action@v3.0.0

  # ruff runs in pre-commit; its pylint hook only reports (--exit-zero), so this job enforces pylint.
  # pylint-odoo is pinned like the pre-commit hook: newer versions do not know some checks listed in .pylintrc.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pylint-odoo==9.1.3

      - name: Run pylint
        run: pylint --rcfile=.pylintrc onlyoffice_odoo onlyoffice_odoo_documents onlyoffice_odoo_templates
