name: Lint

on:
  workflow_dispatch:
  push:
    branches: [develop, 19.0, feature/19.0, 18.0, feature/18.0, 17.0]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm i
      - uses: pre-commit/action@v3.0.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          pip install ruff pylint pylint-odoo

      - name: Run ruff
        run: ruff check onlyoffice_odoo/

      - name: Run pylint
        run: pylint --rcfile=.pylintrc onlyoffice_odoo/ || true
